name: skill checks

on:
  push:
    paths:
      - "skills/house/renovierung-gewerke-praxis/**"
  pull_request:
    paths:
      - "skills/house/renovierung-gewerke-praxis/**"
  schedule:
    - cron: "0 6 1 * *"      # monatlich: tote Links finden, auch ohne Commit
  workflow_dispatch:

jobs:
  # Schnell: läuft bei jedem Push, antwortet in Sekunden.
  schnell:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Struktur (Pflichtabschnitte, Quellen, Unbelegt-Liste)
        working-directory: skills/house/renovierung-gewerke-praxis
        run: python3 scripts/strukturcheck.py
      - name: Fehlerabdeckung
        working-directory: skills/house/renovierung-gewerke-praxis
        run: python3 scripts/fehlercheck.py

  # Langsam (über 1.100 URLs): nur monatlich und auf Zuruf, damit ein Push nicht 20 Minuten blockiert.
  links:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Alle Quellen-URLs prüfen
        working-directory: skills/house/renovierung-gewerke-praxis
        run: python3 scripts/linkcheck.py --jobs 8
