name: skill checks

on:
  push:
    paths:
      - "skills/house/renovierung-gewerke-praxis/**"
  pull_request:
    paths:
      - "skills/house/renovierung-gewerke-praxis/**"
  schedule:
    - cron: "0 6 1 * *"      # monatlich: tote Links finden, auch ohne Commit
  workflow_dispatch:

jobs:
  renovierung:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Struktur (Pflichtabschnitte, Quellen, Unbelegt-Liste)
        working-directory: skills/house/renovierung-gewerke-praxis
        run: python3 scripts/strukturcheck.py
      - name: Fehlerabdeckung
        working-directory: skills/house/renovierung-gewerke-praxis
        run: python3 scripts/fehlercheck.py
      - name: Links
        working-directory: skills/house/renovierung-gewerke-praxis
        run: python3 scripts/linkcheck.py --jobs 4
